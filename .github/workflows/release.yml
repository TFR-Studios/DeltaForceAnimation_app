name: Release

# 打一个 v* 标签 → 两个 runner 分别出包 → 自动建 Release 并挂附件。
# 也可以从 Actions 页面手动触发(手动触发只出包,不发 Release)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发布前的第一道闸:版本号对不上就直接停,不浪费十分钟去打包。
  # 打标签触发时:三处版本号必须一致,且标签名去掉 v 后也要等于版本号。
  # 手动触发时:只校验三处版本号互相一致(没有标签可比)。
  verify:
    name: 校验版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 三处版本号 + 标签名一致性
        run: node scripts/check-version.mjs

  windows:
    name: Windows(Electron)
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建前端(类型检查 + Vite)
        run: npm run build
      - name: 打包(免安装目录 + 便携版单文件)
        run: npx electron-builder --win --x64 --publish never
      - name: 整理产物
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $portable = Get-ChildItem release -Filter 'DeltaForceAnimationEditor-Portable-*.exe' | Select-Object -First 1
          if ($portable) { Copy-Item $portable.FullName "release-assets/$($portable.Name)" }
          # 一键安装包:推荐形态(安装器有进度条/任务栏可见,装完启动 1 秒)
          $setup = Get-ChildItem release -Filter 'DeltaForceAnimationEditor-Setup-*.exe' | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName "release-assets/$($setup.Name)" }
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release-assets/DeltaForceAnimationEditor-$ver-win-unpacked.zip" -CompressionLevel Optimal
          Get-ChildItem release-assets | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Android(arm64 release APK,已签名)
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 25.2.9519653
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Android SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION" "platform-tools"
      - name: 还原 Android 签名密钥(从 Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD 这两个 Secret(见 README 的 Android 端一节)'; exit 1;
          fi
          cd src-tauri/gen/android
          echo "$KEYSTORE_BASE64" | base64 -d > dfae-release.keystore
          printf 'storeFile=dfae-release.keystore\nstorePassword=%s\nkeyAlias=dfae\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
      - name: 安装依赖
        run: npm ci
      - name: 构建并签名 release APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export NDK_HOME="$ANDROID_NDK_HOME"
          npm run tauri android build -- --apk -t aarch64 --ci
      - name: 校验签名并整理产物
        run: |
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          VER=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          cp "$APK" "release-assets/dfae-${VER}-arm64-v8a.apk"
          ls -l release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: 建 Release 并挂附件
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f "docs/RELEASE_NOTES_${TAG}.md" ]; then
            NOTES="--notes-file docs/RELEASE_NOTES_${TAG}.md"
          else
            NOTES="--generate-notes"
          fi
          # 可重复执行:已经发过就把附件与说明更新一遍,不新建(标签移动 / 重跑流水线时不会报错)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑或手工传错时,旧版本的附件可能还挂在这次发行版上;清掉不属于当前版本的包,
            # 避免用户在新版下载页里点到 1.0.1 的文件。
            VER="${TAG#v}"
            gh release view "$TAG" --json assets -q '.assets[].name' | while IFS= read -r name; do
              [ -z "$name" ] && continue
              case "$name" in
                *"$VER"*) ;;
                *) echo "删除不属于当前版本的旧附件: $name"; gh release delete-asset "$TAG" "$name" --yes || true ;;
              esac
            done
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "$TAG" $NOTES
          else
            gh release create "$TAG" --title "$TAG" $NOTES release-assets/*
          fi
      # 把同一批产物也同步到 GitCode 的发行版仓库。
      # 为什么不是代码镜像仓库:GitCode 的镜像仓库只读,不允许创建新标签,
      # 给新版本建发行版会报 “repository is an image repository”。
      # 所以安装包统一传到普通仓库 DeltaForceAnimation_releases。
      # 没配 GITCODE_TOKEN 会让这一步失败(而不是静默跳过),否则“发布成功”会盖住
      # “GitCode 还停在旧版本”的事实。补同步:运行 Sync to GitCode 工作流。
      - name: 同步到 GitCode 发行版仓库
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: DeltaForceAnimation_releases
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then
            # 这里以前是“打条警告然后跳过”,结果 v1.0.2 只在 GitHub 上发了,GitCode 一直停在 v1.0.1,
            # 而整条流水线还是绿的。同步是发布契约的一部分,缺令牌就必须红,不能静默。
            echo "::error::没有配置 GITCODE_TOKEN,GitCode 上的安装包不会更新。请按 README「同步到 GitCode」一节添加 Secret 后重跑这一步(或运行 Sync to GitCode 工作流补同步)。"
            exit 1
          fi
          node scripts/publish-to-gitcode.mjs "$GITHUB_REF_NAME" release-assets
