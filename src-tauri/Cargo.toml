# Tauri v2 外壳(Windows 桌面 + Android 移动端)。
#
# 依赖按平台分开声明,**只用标准 cfg**(见 build.rs 里的说明:Cargo 解析依赖图时看不到
# build script 设置的自定义 cfg,所以这里不能用 cfg(desktop)):
#   [dependencies]                              两个平台都要
#   [target.'cfg(not(target_os = "android"))']  桌面端专属(单实例、窗口记忆、内置 HTTP 服务、系统另存为)
#   [target.'cfg(windows)']                     仅 Windows
#
# 说明:
#   · tiny_http 只给桌面端的内置 HTTP 服务用(Android 的页面由 Tauri 内置 asset 协议提供);
#   · tauri-plugin-opener 承担 Android 上的"打开外链/打开文件/打开目录"(内部是 Java Intent),
#     桌面端仍然用自己写的 ShellExecuteW,行为与 Electron 版逐条一致;
#   · 没有手写任何 Java/JNI:无法在本机编译验证的代码不进交付物。
[package]
name = "dfae-tauri"
version = "1.0.1"
description = "三角洲行动动画编辑器 · Tauri v2 外壳(Windows / Android)"
authors = ["TFR-Studios"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dfae_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tiny_http = "0.12"
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
# 「保存到相册」:直接调 Android 的 MediaStore 插入媒体项(见 src/mediastore.rs)。
#   · jni         —— 把字节写进 MediaStore 需要的 JNI 调用;
#   · ndk-context —— 拿 JavaVM 与 Context。它由 tao 的 android 事件循环初始化
#                    (tao 的 ndk_glue.rs 调 initialize_android_context),
#                    MediaStore 只要有 Context 就能拿到 ContentResolver,不需要 Activity,
#                    因此不必为一个能力引入一整个 Tauri 移动插件。
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# dev 走默认配置;release 压缩体积。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
